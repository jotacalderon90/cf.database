
services:
  
  database:
    build:
      context: .
      target: prod
    image: database:0.0.1
    container_name: database
    restart: unless-stopped
    mem_limit: 128M
    mem_reservation: 64M
    env_file:
      - .env.production
    volumes:
      - /var/log/trascender/database:/srv/cf.database/logs
    environment:
      NODE_ENV: "production"
      PORT: 2204
    ports:
      - "127.0.0.1:2204:2204"