
  <!-- Modal para solicitar confirmación -->
  <div class="modal fade"
    id="mdConfirm"
    tabindex="-1"
    aria-hidden="true"
    data-bs-backdrop="static"
    data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title d-flex align-items-center">
            <i class="fa fa-circle-question text-warning me-2"></i>
            Confirmación
          </h5>
        </div>
        <div class="modal-body pt-2">
          <p class="mb-0 text-muted">
            {{ modal.data.confirm.msg }}
          </p>
        </div>
        <div class="modal-footer border-0 pt-0">
          <button type="button" class="btn btn-sm btn-light" v-on:click="modal.cancelar()">
            {{ modal.data.confirm.cancelText || 'Cancelar' }}
          </button>
          <button type="button" class="btn btn-sm btn-primary" v-on:click="modal.aceptar()">
            {{ modal.data.confirm.okText || 'Aceptar' }}
          </button>
        </div>
      </div>
    </div>
  </div>
