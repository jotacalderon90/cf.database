  <div class="d-flex">
		<aside class="border border-end bg-body-tertiary min-vh-100 flex-shrink-0 offcanvas-md offcanvas-end"
			tabindex="-1" id="sidebarMenu" aria-labelledby="sidebarMenuLabel" style="width: 300px;">
      
      <nav class="nav nav-pills flex-column px-3 mt-4 gap-2 main-fixed">
        <a class="nav-link" href="/">
          <i class="bi bi-house-door me-2"></i> Inicio
        </a>
        <a 
          v-for="(atributo, indice) in monitor.listaAtributos"
          :key="atributo"
          :href="'/monitorear#dv_' + indice"
          class="nav-link text-start text-success"
        >
          <i class="bi bi-activity me-2"></i>
          {{ atributo }}
        </a>
      </nav>
      
    </aside>
    <div class="resizer"></div>
		<main class="flex-grow-1 px-md-4 mb-4" style="min-width: 0;">
      
      <h4 class="mt-4 d-flex justify-content-between align-items-center">
        <span>Monitor de Salud de Base de Datos</span>
        <i
            class="fas fa-copy text-muted"
            style="cursor:pointer"
            title="Copiar"
            v-on:click="monitor.copy()"
        ></i>
      </h4>
      <hr>
      <div class="container my-4">
        <div v-for="(atributo, indice) in monitor.listaAtributos" :key="indice" :id="'dv_' + indice" class="a4-page mb-4">
          <p>
            <strong>{{atributo}}</strong> {{monitor.tempDescription(atributo)}}
            <i class="fas fa-copy text-muted"
              style="cursor:pointer"
              title="Copiar"
              v-on:click="monitor.copy(indice)">
            </i>
          </p>
          <canvas :id="'chart_' + indice"></canvas>
        </div>
      </div>
      
    </main>
  </div>
