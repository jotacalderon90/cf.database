<!--define:main-->
	
	<!--include:header-->
	<!--include:modal/_-->
	
  <div class="d-flex">
		<aside class="border border-end bg-body-tertiary min-vh-100 flex-shrink-0 offcanvas-md offcanvas-end"
			tabindex="-1" id="sidebarMenu" aria-labelledby="sidebarMenuLabel" style="width: 300px;">
      
      <nav class="nav flex-column px-3 mt-4" style="position:fixed">
					<a class="nav-link" href="/">
						<i class="fa fa-home"></i> Inicio
					</a>
					<a class="nav-link" :href="'/objetos/' + registroStory.object.name">
						<i class="fa fa-database"></i> Datos
					</a>
				</nav>
      
    </aside>
    <div class="resizer"></div>
		<main class="flex-grow-1 px-md-4 mb-4" style="min-width: 0;">
    
		  <h4 class="mt-4">
					<span v-show="registroStory.isCreateMode()">
						Nuevo registro
					</span>
					<span v-show="registroStory.isEditMode()">
						{{registroStory.registro.title}}
					</span>
				</h4>
				
				<hr>
				
				<div class="mb-3">
					<label for="inputTitle" class="form-label">Título</label>
					<input type="text" class="form-control" id="inputTitle" placeholder="Título" v-model="registroStory.registro.title" v-on:blur="registroStory.updateUrl()"/>
				</div>
				
				<div class="mb-3">
					<label for="inputUrl" class="form-label">URL</label>
					<input type="text" class="form-control" id="inputUrl" placeholder="URL" v-model="registroStory.registro.uri" />
				</div>
        
				<div class="mb-3">
					<label for="inputResume" class="form-label">Resumen</label>
					<input type="text" class="form-control" id="inputResume" placeholder="Resumen" v-model="registroStory.registro.resume" />
				</div>
				
				<div class="mb-3">
					<label for="input_content" class="form-label">Contenido</label>
					<input type="text" class="form-control" id="input_content" placeholder="Contenido" />
				</div>
        
				<div class="mb-3" v-show="!registroStory.isCreateMode()">
					<label for="inputImage" class="form-label">Imagen</label>
          <input type="file" class="form-control" id="inputImage" placeholder="Título" v-show="registroStory.isEditMode()" v-on:change="registroStory.changeIMG($event)" />
					<img id="dataImage" height="200" />
				</div>
        
				<!--
				<div class="mb-3">
					<label for="inputYoutube" class="form-label">Youtube</label>
					<input type="text" class="form-control" id="inputYoutube" placeholder="Youtube" v-model="registroStory.registro.youtube" />
				</div>
				-->
				<div class="mb-3">
					<label for="input_tag" class="form-label">Tags</label>
					<input 
						type="text" 
						class="form-control" 
						id="input_tag" 
						placeholder="Agregar tag" 
						v-model="registroStory.registro.tagbk" 
						v-on:keypress="registroStory.addTag($event)"/>
					<p>
						<span v-for="(row, index) in registroStory.registro.tag" :key="index">
							<span class="badge text-bg-primary">
								{{row}}
								<i class="fa fa-close text-danger" v-on:click="registroStory.removeTag(index)"></i>
							</span>
							&nbsp;
						</span>
					</p>
				</div>
				
				<div class="mb-3">
					<label for="inputTagPrincipal" class="form-label">Tag Principal</label>
					<select class="form-control" v-model="registroStory.registro.tag_main" >
							<option v-for="row in registroStory.registro.tag">{{row}}</option>
					</select>
				</div>
				
				<div class="mb-3">
					<label class="form-check-label" for="inputHabilitado">
						Habilitado&nbsp;
					</label>
					<input class="form-check-input" id="inputHabilitado" type="checkbox" v-model="registroStory.registro.active">
				</div>
				
				<div class="mb-3">
					<label for="inputDomain" class="form-label">Domain <small>(ejm: 'story'.midominio.cl )</small></label>
					<input type="text" class="form-control" id="inputDomain" placeholder="Dominio (storyinformatica/storychile)" v-model="registroStory.registro.domain" />
				</div>
				
        <!--------->
        <!--STORY-->
        <!--------->
        
				<div class="mb-3">
					<label for="inputYear" class="form-label">Año</label>
					<input type="number" class="form-control" id="inputYear" v-model="registroStory.registro.year" />
				</div>
				<div class="mb-3">
					<label for="inputYear" class="form-label">Mes</label>
					<input type="number" class="form-control" id="inputMonth" v-model="registroStory.registro.month" />
				</div>
				<div class="mb-3">
					<label for="inputYear" class="form-label">Día</label>
					<input type="number" class="form-control" id="inputDay" v-model="registroStory.registro.day" />
				</div>
        <div class="mb-3">
					<label for="input_font" class="form-label">Fuentes</label>
					<input 
						type="text" 
						class="form-control" 
						id="input_font" 
						placeholder="Agregar fuente" 
						v-model="registroStory.registro.fontbk" 
						v-on:keypress="registroStory.addFont($event)"/>
					<p>
						<span v-for="row in registroStory.registro.font">
							<span class="badge text-bg-primary">
								{{row}}
								<i class="fa fa-close text-danger" v-on:click="registroStory.removeFont($index)"></i>
							</span>
							&nbsp;
						</span>
					</p>
				</div>
        
				<!--include:global/map/_-->
				
				<label>UBICACIÓN</label>
							
				<button class="btn btn-warning" v-on:click="registroStory.setMap()">
					<i class="fa fa-map"></i>
				</button>
				
				<div class="mb-3">
					<label>Latitud</label>
					<input type="number" class="form-control" v-model="registroStory.registro.map.lat" />
				</div>
				<div class="mb-3">
					<label>Longitud</label>
					<input type="number" class="form-control" v-model="registroStory.registro.map.lng" />
				</div>
				<div class="mb-3">
					<label>Zoom</label>
					<input type="number" class="form-control" v-model="registroStory.registro.map.zoom" />
				</div>
				
        <!----------->
        <!--ACTIONS-->
        <!----------->
        
				<div class="text-end bg-body-tertiary">
					<hr>
					<!--<a :href="'https://' + registroStory.host + '/' + registroStory.registro.uri" class="btn btn-info">
						<i class="fa fa-eye"></i>
					</a>-->
					<a :href="'/objetos/' + registroStory.object.name + '/' + registroStory.registro.id" class="btn btn-info">
						<i class="fa fa-database"></i>
					</a>
					<button type="button" class="btn btn-primary" title="Crear" v-on:click="registroStory.create()" v-show="registroStory.isCreateMode()">
						<i class="fa fa-check"></i>
					</button>
					<button type="button" class="btn btn-success" title="Actualizar" v-on:click="registroStory.update()" v-show="registroStory.isEditMode()">
						<i class="fa fa-check"></i>
					</button>
					<button type="button" class="btn btn-danger" title="Eliminar" v-on:click="registroStory.delete()" v-show="registroStory.isEditMode()">
						<i class="fa fa-trash"></i>
					</button>
					<hr>
				</div>
    
    </main>
  </div>
  
<!--/define:main-->
